<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for text path -->
  <defs>
    <!-- Path starting at bottom-left, curving up and over the top, ending at bottom-right -->
    <path id="textCirclePath" d="M 102,398 A 210,210 0 1,1 398,398" />
  </defs>
  
  <!-- Stylized Digital Grid blocks at the top outer rim -->
  <g fill="#004ea3">
    <!-- Row 1 (topmost) -->
    <rect x="235" y="10" width="30" height="20" />
    <rect x="180" y="15" width="20" height="15" />
    <rect x="300" y="15" width="20" height="15" />
    <rect x="120" y="25" width="25" height="15" />
    <rect x="355" y="25" width="25" height="15" />
    
    <!-- Row 2 -->
    <rect x="210" y="35" width="20" height="20" />
    <rect x="270" y="35" width="20" height="20" />
    <rect x="150" y="45" width="25" height="15" />
    <rect x="325" y="45" width="25" height="15" />
    <rect x="90" y="55" width="20" height="20" />
    <rect x="390" y="55" width="20" height="20" />
    
    <!-- Row 3 -->
    <rect x="110" y="80" width="20" height="20" />
    <rect x="370" y="80" width="20" height="20" />
    <rect x="65" y="95" width="25" height="20" />
    <rect x="410" y="95" width="25" height="20" />
    <rect x="50" y="125" width="20" height="30" />
    <rect x="430" y="125" width="20" height="30" />
  </g>
  
  <!-- Outer thick blue ring with text -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#004ea3" stroke-width="45" />
  
  <!-- Text inside the blue ring -->
  <text fill="#ffffff" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="800" letter-spacing="3.5">
    <textPath href="#textCirclePath" xlink:href="#textCirclePath" startOffset="50%" text-anchor="middle">
      COUNCIL FOR DIGITAL DATA PROTECTION AND PRIVACY
    </textPath>
  </text>
  
  <!-- Two decorative white dots on the blue ring at the bottom sides -->
  <circle cx="130" cy="385" r="8" fill="#ffffff" />
  <circle cx="370" cy="385" r="8" fill="#ffffff" />
  
  <!-- Inner circular region with eye and lock -->
  <circle cx="250" cy="250" r="150" fill="#ffffff" stroke="#004ea3" stroke-width="6" />
  
  <!-- The Eye Graphic -->
  <path d="M 140,250 Q 250,170 360,250 Q 250,330 140,250 Z" fill="none" stroke="#004ea3" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Pupil (centered circle) -->
  <circle cx="250" cy="250" r="48" fill="none" stroke="#004ea3" stroke-width="6" />
  
  <!-- Padlock inside the Pupil (Center: 250, 250) -->
  <!-- Lock shackle (curved arch) -->
  <path d="M 232,243 V 225 A 18,18 0 0,1 268,225 V 243" fill="none" stroke="#004ea3" stroke-width="6" stroke-linecap="round" />
  <!-- Lock body (rectangle with rounded corners) -->
  <rect x="222" y="243" width="56" height="42" rx="6" ry="6" fill="#004ea3" />
  <!-- Keyhole in the lock body -->
  <circle cx="250" cy="259" r="5" fill="#ffffff" />
  <polygon points="248,263 252,263 254,277 246,277" fill="#ffffff" />
</svg>
